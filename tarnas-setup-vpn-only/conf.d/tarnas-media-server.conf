server {
    listen 80;
    server_name tarnas-media-server;

    # Serve static files from /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Root path serves static index.html
    location / {
        try_files $uri $uri/ =404;
    }

    location /jellyfin/ {
        proxy_pass http://jellyfin:8096/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /qbittorrent/ {
        proxy_pass http://nordvpn:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /seerr/ {
        return 301 http://192.168.0.178:5055;
    }

    location /radarr/ {
        return 301 http://192.168.0.178:7878;
    }

    location /sonarr/ {
        return 301 http://192.168.0.178:8989;
    }

    location /prowlarr/ {
        return 301 http://192.168.0.178:9696;
    }

    location /bazarr/ {
        return 301 http://192.168.0.178:6767;
    }

    location /portainer/ {
        return 301 http://192.168.0.178:9000;
    }
}
